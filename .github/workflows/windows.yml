name: Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: "python -m pip install --only-binary=:all: -r scripts/requirements.txt"
      - run: python scripts/prepare-font.py
      - run: npm ci
      - run: cargo fmt --check
      - run: npm run build:desktop
      - run: cargo clippy --release --locked -- -D warnings
      - name: Package Windows release
        run: python scripts/package-release.py
      - name: Keep distribution from main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Tahm-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

[package]
name = "tahm"
version = "0.9.0"
edition = "2021"
description = "塔姆 · 磁盘空间分析"
license = "Apache-2.0"
repository = "https://github.com/la8garlic/Tahm"
publish = false

[[bin]]
name = "Tahm"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
file-id = "0.2"
filesize = "0.2"
fs2 = "0.4"
winapi-util = "0.1"
winsafe = { version = "0.0.29", features = ["shell"] }
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
rfd = { version = "0.18", default-features = false }
tempfile = "3"
genai = "0.7"
serde_json = "1"
trash = { version = "5.4", default-features = false, features = ["coinit_apartmentthreaded"] }
dirs = "7"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
